services:
  tomhrm-autoreporting:
    build:
      dockerfile: Dockerfile
    container_name: tomhrm-autoreporting
    volumes:
      - ./screenshots:/screenshots
    environment:
      - TOMHRM_USERNAME
      - TOMHRM_PASSWORD
      - TOMHRM_WORKSPACE
      - TELEGRAM_BOT_TOKEN
      - TELEGRAM_CHAT_ID
    restart: unless-stopped